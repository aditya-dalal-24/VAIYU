[pytest]
testpaths = tests
pythonpath = .

# Model checkpoints written during tests are tens of megabytes, and pytest
# keeps the last three runs by default. That accumulates fast enough to fill a
# disk, so temporary directories survive only when a test failed and they are
# worth inspecting.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1

filterwarnings =
    ignore::DeprecationWarning
