server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cyclovision-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cyclovision}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

demo:
  mode: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}