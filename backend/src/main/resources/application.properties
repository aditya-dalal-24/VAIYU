spring.application.name=cyclovision-backend
server.port=8080

# Database Configuration (H2 In-Memory Database for instant setup)
spring.datasource.url=jdbc:h2:mem:cyclovisiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# AI Service Endpoint
ai.service.url=http://localhost:8000
demo.mode=true

# Actuator Health & Observability (Section 15)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
