# NOTE: this file is aspirational, not working. None of ./backend, ./ai-service
# or ./frontend contains a Dockerfile, so `docker compose up` fails at the
# build step. It is kept as the intended shape of a container deployment; the
# supported way to run VAIYU today is the local setup in the root README.
version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vaiyu-db
    environment:
      POSTGRES_DB: vaiyu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
      
  ai-service:
    build: ./ai-service
    container_name: vaiyu-ai
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    container_name: vaiyu-backend
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      # Where the AI service can fetch uploaded satellite frames from.
      PUBLIC_BASE_URL: http://backend:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vaiyu
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: changeme
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - postgres
      - ai-service

  frontend:
    build: ./frontend
    container_name: vaiyu-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
